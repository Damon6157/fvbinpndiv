version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: selfbot
      POSTGRES_PASSWORD: selfbot_secret
      POSTGRES_DB: selfbot_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://selfbot:selfbot_secret@db:5432/selfbot_dashboard?schema=public
      - REDIS_URL